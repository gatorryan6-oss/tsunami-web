<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-id" content="tsunami-web">
<title>Tsunami Simulator — Web</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #10151c; color: #dce3ec;
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  header { margin: 14px 0 6px; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 0.85rem; color: #8fa0b4; }
  #controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    justify-content: center; margin: 10px 0;
  }
  select, button {
    background: #1c2530; color: #dce3ec; border: 1px solid #33414f;
    border-radius: 6px; padding: 6px 12px; font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #5a7189; }
  #viewwrap {
    position: relative;
    width: min(92vw, 660px); aspect-ratio: 1;
  }
  #viewwrap canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: auto; border-radius: 4px;
  }
  #view { border: 1px solid #2a3542; background: #000; }
  #overlay { pointer-events: none; border: 1px solid transparent; }
  #status {
    font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem;
    color: #9fb3c8; margin: 8px 0 4px; min-height: 1.2em;
  }
  #desc {
    font-size: 0.82rem; color: #8fa0b4; max-width: min(92vw, 660px);
    text-align: center; margin: 2px 0 10px; min-height: 2.2em;
  }
  #town {
    font-size: 0.82rem; color: #b7a77a; max-width: min(92vw, 660px);
    text-align: center; margin: 0 0 6px; min-height: 1.2em;
    font-family: ui-monospace, Consolas, monospace;
  }
  #town.warn { color: #e0a13d; }
  #damage {
    font-size: 0.82rem; color: #9fb3c8; max-width: min(92vw, 660px);
    text-align: center; margin: 0 0 6px; min-height: 1.2em;
    font-family: ui-monospace, Consolas, monospace;
  }
  #damage.hit { color: #f0a868; }
  #casualty {
    font-size: 0.82rem; color: #9fb3c8; max-width: min(92vw, 660px);
    text-align: center; margin: 0 0 10px; min-height: 1.2em;
    font-family: ui-monospace, Consolas, monospace;
  }
  #casualty.hit { color: #ff8f8f; }
  /* 3D mode: the anomaly colorbar and the fixed scale bar describe the
     top-down map, not a perspective scene — hide them there. */
  body.view3d #legend { display: none; }
  body.view3d #view { cursor: grab; }
  /* Legend: colorbar + scale bar — the display read as science. */
  #legend {
    display: flex; gap: 26px; align-items: flex-end; flex-wrap: wrap;
    justify-content: center; margin: 10px 0 4px;
    width: min(92vw, 660px);
  }
  #colorbar { flex: 1 1 260px; }
  #colorbar .bar {
    height: 12px; border-radius: 3px; border: 1px solid #2a3542;
    /* EXACTLY the display.frag anomalyColor() ramp, sampled at
       a = -1, -0.5, 0, +0.5, +1 (keep in sync with the shader).
       Zero (calm sea) is a light ocean blue. */
    background: linear-gradient(to right,
      #0a3161 0%, #245f9c 25%, #62a3d6 50%,
      #ee9a4d 75%, #c62f1f 100%);
  }
  #colorbar .labels, #scalebar .labels {
    display: flex; justify-content: space-between;
    font-size: 0.72rem; color: #9fb3c8; margin-top: 3px;
    font-family: ui-monospace, Consolas, monospace;
  }
  #colorbar .title, #scalebar .title {
    font-size: 0.75rem; color: #b7c6d6; margin-bottom: 4px;
  }
  #scalebar .bar {
    height: 0; border-bottom: 3px solid #b7c6d6; position: relative;
  }
  #scalebar .bar::before, #scalebar .bar::after {
    content: ""; position: absolute; bottom: -1px; width: 2px; height: 8px;
    background: #b7c6d6;
  }
  #scalebar .bar::before { left: 0; }
  #scalebar .bar::after { right: 0; }
  footer { font-size: 0.75rem; color: #6d7f92; margin: 6px 0 18px; }
  footer a { color: #7db8ed; }
  #fatal {
    display: none; position: fixed; inset: 0; background: #200a0a;
    color: #ffd7d7; font-size: 1.05rem; padding: 12vh 14vw; line-height: 1.5;
    align-items: center; justify-content: center; text-align: center;
    white-space: pre-wrap;
  }
  label { font-size: 0.85rem; color: #9fb3c8; }
</style>
</head>
<body>
<header>
  <h1>Tsunami Simulator</h1>
  <p>WebGL2 port — physics parity with the desktop reference (tsunami-web)</p>
</header>
<div id="controls">
  <label>Scenario <select id="scenario"></select></label>
  <button id="run">Run</button>
  <button id="reset">Reset</button>
  <button id="daynight" title="Toggle who is where: homes by night, schools/workplaces by day">☀ Day</button>
  <button id="viewmode" title="Switch between the top-down map and the 3D scene">3D view</button>
  <label>Overlay <select id="overlaySel" title="Paint an accumulated hazard field as a heatmap"></select></label>
  <label>Speed <input id="speed" type="range" min="1" max="240" value="30" step="1">
    <span id="speedval">x30</span></label>
</div>
<div id="viewwrap">
  <canvas id="view" width="513" height="513"></canvas>
  <canvas id="overlay"></canvas>
</div>
<div id="legend">
  <div id="colorbar">
    <div class="title">Sea-surface anomaly (m above/below normal)</div>
    <div class="bar"></div>
    <div class="labels"><span>−2 m</span><span>0</span><span>+2 m</span></div>
  </div>
  <div id="scalebar">
    <div class="title">Distance</div>
    <div class="bar" style="width:110px"></div>
    <div class="labels"><span>0</span><span id="scalelabel">20 km</span></div>
  </div>
</div>
<div id="status">booting…</div>
<div id="desc"></div>
<div id="town"></div>
<div id="damage"></div>
<div id="casualty"></div>
<div id="fatal"></div>
<footer>
  Physics verified against the desktop reference:
  <a href="parity.html">parity harness</a> ·
  <a href="tests.html">accessor contract</a>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
